<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e0f13">
  <title>RuleMaster 2.0 — Dashboard</title>
  <meta name="description" content="Manage RuleMaster 2.0 on your Discord servers.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <section id="loginView" class="login-view" hidden>
    <div class="login-card">
      <div class="logo-icon big">R</div>
      <h1>RuleMaster <span>2.0</span></h1>
      <p>Log in with your Discord account to manage your servers. No separate account needed.</p>
      <button id="loginBtn" class="btn btn-discord">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.6 1.3a18.4 18.4 0 0 0-5.6 0L8.6 3a19.7 19.7 0 0 0-4.9 1.4C.6 9 .-.2 13.6.3 18.1a19.9 19.9 0 0 0 6 3l1.3-2a13 13 0 0 1-2-1l.5-.4a14.2 14.2 0 0 0 12.2 0l.5.4-2 1 1.3 2a19.8 19.8 0 0 0 6-3c.5-5.2-.8-9.7-3.5-13.7ZM8.3 15.3c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4Zm7.4 0c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4Z"/></svg>
        Login with Discord
      </button>
      <small>We only read your username, avatar and server list.</small>
    </div>
  </section>

  <!-- APP -->
  <div id="appView" class="app" hidden>
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/dashboard">
        <span class="logo-icon">R</span>
        <span>RuleMaster <em>2.0</em></span>
      </a>

      <nav class="nav">
        <a href="#/dashboard" data-route="dashboard">▦ <span>Dashboard</span></a>
        <a href="#/servers" data-route="servers">◎ <span>Servers</span></a>
        <a href="#/commands" data-route="commands">⌘ <span>Commands</span></a>
        <a href="#/settings" data-route="settings">⚙ <span>Settings</span></a>
        <div class="nav-sep"></div>
        <a href="https://discord.gg/" target="_blank" rel="noopener">? <span>Support</span></a>
        <a href="#/docs" data-route="docs">▤ <span>Documentation</span></a>
      </nav>

      <div class="profile">
        <img id="userAvatar" alt="" class="avatar">
        <div class="profile-text">
          <strong id="userName">User</strong>
          <small id="userId"></small>
        </div>
        <button id="logoutBtn" class="icon-btn" title="Logout" aria-label="Logout">⏻</button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn menu-btn" aria-label="Open menu">☰</button>
        <h2 id="pageTitle">Dashboard</h2>
        <a class="btn btn-ghost" id="inviteTop" target="_blank" rel="noopener">Add RuleMaster ↗</a>
      </header>
      <main id="content" class="content"></main>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>
</body>
</html>
