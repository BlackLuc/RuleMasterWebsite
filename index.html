<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090a10">
  <title>RuleMaster 2.0 — Dashboard</title>
  <meta name="description" content="Manage RuleMaster 2.0 on your Discord servers.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <section id="loginView" class="login-view">
    <div class="login-card">
      <div class="logo-icon big">R</div>
      <h1>RuleMaster <span>2.0</span></h1>
      <p>Log in with your Discord account to manage your servers. No separate account needed.</p>
      
      <button id="loginBtn" class="btn btn-discord">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="currentColor">
          <path d="M19.54 4.23A18.65 18.65 0 0 0 15.8 3l-.46.94a17.26 17.26 0 0 0-6.68 0L8.2 3a18.72 18.72 0 0 0-3.74 1.23C2.09 7.86 1.45 11.39 1.77 14.87a18.7 18.7 0 0 0 4.59 2.31l1.11-1.5a11.88 11.88 0 0 1-1.75-.84l.42-.32a13.3 13.3 0 0 0 11.72 0l.43.32a11.78 11.78 0 0 1-1.76.84l1.11 1.5a18.67 18.67 0 0 0 4.59-2.31c.37-4.08-.63-7.58-2.69-10.64ZM8.63 13.58c-1.13 0-2.05-1.04-2.05-2.32s.9-2.33 2.05-2.33 2.07 1.05 2.05 2.33c0 1.28-.91 2.32-2.05 2.32Zm6.74 0c-1.13 0-2.05-1.04-2.05-2.32s.9-2.33 2.05-2.33 2.07 1.05 2.05 2.33c0 1.28-.91 2.32-2.05 2.32Z"/>
        </svg>
        <span>Login with Discord</span>
      </button>

      <small>We only read your username, avatar and server list.</small>
    </div>
  </section>

  <!-- DASHBOARD APP -->
  <div id="appView" class="app hidden">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="javascript:void(0)" data-page="dashboard">
        <span class="logo-icon">R</span>
        <span>RuleMaster <em>2.0</em></span>
      </a>

      <nav class="nav">
        <a href="javascript:void(0)" data-page="dashboard" class="active">▦ <span>Dashboard</span></a>
        <a href="javascript:void(0)" data-page="servers">◎ <span>Servers</span></a>
        <a href="javascript:void(0)" data-page="commands">⌘ <span>Commands</span></a>
        <a href="javascript:void(0)" data-page="settings">⚙ <span>Settings</span></a>
        <div class="nav-sep"></div>
        <a href="https://discord.gg/" target="_blank" rel="noopener">? <span>Support</span></a>
        <a href="javascript:void(0)" data-page="docs">▤ <span>Documentation</span></a>
      </nav>

      <div class="profile">
        <img id="userAvatar" alt="" class="avatar">
        <div class="profile-text">
          <strong id="userName">User</strong>
          <small id="userId"></small>
        </div>
        <button id="logoutBtn" class="icon-btn" title="Logout" aria-label="Logout">⏻</button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn menu-btn" aria-label="Open menu">☰</button>
        <h2 id="pageTitle">Dashboard</h2>
        <a class="btn btn-ghost" id="inviteTop" target="_blank" rel="noopener">Add RuleMaster ↗</a>
      </header>
      <main id="content" class="content"></main>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>
</body>
</html>
